name: Verify Orrery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=verbose --silent=false
      - run: npm run build
      - run: python scripts/scan-secrets.py
  containers:
    runs-on: ubuntu-latest
    env:
      PUBLIC_APP_URL: https://orrery.example.org
      ORRERY_DOMAIN: orrery.example.org
      ACME_EMAIL: ci@example.org
      API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build web api
      - run: docker compose run --rm --no-deps web caddy validate --config /etc/caddy/Caddyfile
      - name: Verify persistent database and online backup
        run: |
          docker compose run --rm --no-deps api python -m deploy.check_storage write
          docker compose run --rm --no-deps api python -m deploy.check_storage read
          docker compose run --rm --no-deps backup python -m deploy.backup
      - if: always()
        run: docker compose down --volumes
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: orrery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://orrery:ci-only-disposable@localhost:5432/orrery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests/test_serverless.py -q
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
